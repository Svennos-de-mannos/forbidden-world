<div class="popup-overlay" id="popupOverlay" hidden>
  <div class="popup" id="popup">
    <button class="popup-close" id="popupClose" aria-label="Close">&times;</button>
    <div class="popup-image placeholder" id="popupImage"></div>
    <div class="popup-body">
      <h2 class="popup-title popup-title--plain" id="popupTitle" data-field></h2>
      <p class="popup-role" id="popupMeta" data-field></p>
      <p class="popup-players" id="popupPlayers" data-field></p>
      <p class="popup-text" id="popupText" data-field></p>
    </div>
  </div>
</div>
