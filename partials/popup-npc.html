<div class="popup-overlay" id="popupOverlay" hidden>
  <div class="popup" id="popup">
    <button class="popup-close" id="popupClose" aria-label="Close">&times;</button>
    <div class="popup-image placeholder" id="popupImage"></div>
    <div class="popup-body">
      <h2 class="popup-title popup-title--plain" id="popupTitle" data-field></h2>
      <p class="popup-role" id="popupRole" data-field></p>
      <dl class="popup-facts">
        <div><dt>Race</dt><dd id="popupRace" data-field></dd></div>
        <div><dt>Class</dt><dd id="popupClass" data-field></dd></div>
        <div><dt>Age</dt><dd id="popupAge" data-field></dd></div>
        <div><dt>Status</dt><dd id="popupStatus" data-field></dd></div>
        <div><dt>Residence</dt><dd id="popupResidence" data-field></dd></div>
        <div><dt>Campaign</dt><dd id="popupCampaign" data-field></dd></div>
      </dl>
      <p class="popup-text" id="popupText" data-field></p>
    </div>
  </div>
</div>
