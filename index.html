<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="index">

<div class="page">

  <div data-include="header"></div>

  <main>

         session recap. Swap image + text for each update. -->

      <div class="hero-image placeholder" aria-label="hero image"></div>
      <div class="hero-body">
        <p class="eyebrow">News</p>
        <h1 class="hero-title">Welcome to the table</h1>
        <p class="hero-desc placeholder"></p>
        <a class="btn" href="#">Read more</a>

    <section class="world">

      <a class="btn btn--wide" href="quests.html">Active quests &amp; mysteries</a>

      <div class="link-grid">

  <div data-include="footer"></div>
